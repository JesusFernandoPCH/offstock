# Policy: nothing newer than 14 days; packages that must move together are grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      - dependency-name: "@types/node" # tracks the Node 24 runtime
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript" # TS 7 (Go port) not yet supported by Next.js
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown:
      default-days: 14

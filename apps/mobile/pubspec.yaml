name: offstock
description: "Offstock: mobile-first POS. Funciona Aunque Te Salgas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  google_sign_in: 7.2.0
  image_picker: 1.2.4
  local_auth: 3.0.2
  shared_preferences: 2.5.6
  supabase_flutter: 2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: false
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf

# Generated from design/logo (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: ../../design/logo/offstock-logo-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#EADCC0"
  adaptive_icon_foreground: ../../design/logo/offstock-mark-1024.png
  min_sdk_android: 21
